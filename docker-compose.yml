# Run the production container images locally, end to end.
#
#   bash scripts/local-env.sh          # once: writes .env with generated secrets
#   docker compose up --build          # http://localhost:8080/health/ready
#   docker compose down -v             # stop and delete the data volumes
#
# Non-secret settings (ports, URLs, database and bucket names) have local
# defaults, so .env only has to carry the secrets. Those have NO default
# on purpose: the containers run as Production, and ProductionConfigurationGuard
# refuses to boot on a secret that looks like a template placeholder, so a
# committed "local-dev-only" literal here would either be rejected or, worse,
# quietly become a repo-public secret on someone's server. scripts/local-env.sh
# generates them; compose names the missing variable if you skip it.
#
# Real deployments configure the same images through Dokploy environment
# variables (ADR-0005), not this file.
#
#if (aspire)
# Aspire (`dotnet run --project src/Host/Boilerplate.AppHost`) is the day-to-day
# inner-loop orchestrator; this file exists to exercise the shipped images.
#endif

name: boilerplate

services:
  # ── Data plane ────────────────────────────────────────────────────
  # PostgreSQL and Valkey stay compose-internal — nothing outside the network
  # needs them, and not publishing them keeps this file from colliding with a
  # Postgres you already run locally.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boilerplate}
      POSTGRES_USER: ${POSTGRES_USER:-boilerplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/local-env.sh to generate .env}
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql and puts the
      # cluster in a major-version subdirectory under it; mounting .../data
      # instead is refused at startup.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boilerplate} -d ${POSTGRES_DB:-boilerplate}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey (BSD-licensed Redis fork). No password: the port is compose-internal
  # only, and a fake one here would just be a credential-shaped literal to leak.
  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS: the S3-compatible object store (Apache-2.0). It replaced MinIO, whose
  # repository is archived and whose images no registry serves anonymously any
  # more. Pinned by tag AND digest, the same pin as the AppHost, the Dokploy
  # stack and both integration-test factories (Architecture.Tests keeps them
  # identical).
  #
  # The image runs as uid 10001 and owns /data as that user, so a fresh named
  # volume is writable as is: no volume-owner step. The volume is `storage_data`,
  # not the old `minio_data`, because a volume the MinIO images wrote belongs to
  # another uid; `docker volume rm boilerplate_minio_data` once you no longer
  # want what was in it.
  storage:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-boilerplate}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?run scripts/local-env.sh to generate .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      #if (frontend)
      # The browser PUTs presigned uploads straight to the store, so it has to answer
      # CORS for every origin a client is served from: the two compose clients, and
      # the Vite dev servers for a `pnpm dev` pointed at this stack.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${APP_DASHBOARD_URL:-http://localhost:8081},${APP_CONSOLE_URL:-http://localhost:8082},http://localhost:5173,http://localhost:5174
      #endif
    volumes:
      - storage_data:/data
    healthcheck:
      # /health/ready, not /health: the liveness endpoint answers a moment before
      # the S3 API does, and storage-init must not race that window.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Published because the browser follows Storage__S3__PublicBaseUrl straight to
    # the S3 API. 9001 is the RustFS console, at
    # http://localhost:9001/rustfs/console/ (its root answers 403). Override STORAGE_API_PORT /
    # STORAGE_CONSOLE_PORT if something else on the host holds them.
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"

  # One-shot: create the bucket the Files module writes to, then allow anonymous
  # GET under `uploads/` — and nowhere else. The app never auto-creates the
  # bucket, so without this the first upload fails with NoSuchBucket. Avatars and
  # tenant branding are served as unsigned URLs (IStorageService.UploadAsync
  # returns BuildPublicUrl), and a bucket is private by default, so they 403 in
  # the browser without the policy. Files-module objects live under `tenants/`
  # where public and private share a key space and visibility is a database
  # column, so that prefix must stay closed.
  #
  # Idempotent: head-bucket skips the create on a rerun, and put-bucket-policy
  # replaces the policy with the same one. Dollar signs meant for the container's
  # shell are doubled so compose leaves them alone.
  storage-init:
    image: amazon/aws-cli:2.37.4@sha256:fdd8d1fcbea9c371678dee5a40df8b178c7a781b4586605756ee28114c97ead6
    restart: "no"
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-boilerplate}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?run scripts/local-env.sh to generate .env}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
      BUCKET: ${STORAGE_BUCKET:-boilerplate}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws s3api create-bucket --bucket "$$BUCKET"
        aws s3api put-bucket-policy --bucket "$$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$BUCKET/uploads/*\"]}]}"
        echo "bucket $$BUCKET ready; anonymous GET open on uploads/ only"

  # Mail catcher: every message the API sends is trapped here instead of being
  # delivered. Web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # ── Observability (opt-in) ────────────────────────────────────────
  # Off by default — the API ships full OpenTelemetry instrumentation (traces,
  # metrics, and OTLP log export via Serilog) but nothing to export it to.
  # This is a disposable local OTLP receiver + viewer, pinned by tag and
  # digest, not anything meant to run in production:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://otlp-receiver:18889 docker compose --profile otel up --build
  # Traces, logs and metrics then show up at http://localhost:${OTEL_UI_PORT:-18888}.
  # To keep it set without repeating it on the command line, put the same
  # OTEL_EXPORTER_OTLP_ENDPOINT line in .env instead (see .env.example).
  otlp-receiver:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0@sha256:d595645ca7f5c075174db998302d8fb09e040516b14dfcb06dd02996659e1c77
    restart: unless-stopped
    profiles: ["otel"]
    environment:
      # No login token to copy locally: this container only ever exists on a
      # developer's own machine, reachable from the compose network plus the
      # one published UI port.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
    ports:
      - "${OTEL_UI_PORT:-18888}:18888"

  # ── Application ───────────────────────────────────────────────────
  # One-shot migrator. Applies every pending migration under a Postgres advisory
  # lock, seeds the root tenant + its admin user and the demo accounts, then
  # exits. The API starts only once this completes, so it can never run against
  # an unmigrated database.
  migrator:
    build:
      context: .
      dockerfile: src/Host/Dockerfile
      target: migrator
    image: boilerplate/migrator:local
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Development, while every other service here runs as Production: `--demo` below is
      # refused outright in a Production host, by design (it mints well-known accounts sharing
      # one password). This stack exists to exercise the shipped images locally and wants demo
      # accounts to sign in as; the deploy/dokploy stacks run the same image as Production and
      # pass no --demo. Drop the --demo flag and this line together if you want neither.
      DOTNET_ENVIRONMENT: Development
      DatabaseOptions__Provider: POSTGRESQL
      DatabaseOptions__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-boilerplate};Username=${POSTGRES_USER:-boilerplate};Password=${POSTGRES_PASSWORD:?run scripts/local-env.sh to generate .env}
      DatabaseOptions__MigrationsAssembly: Boilerplate.Migrations.PostgreSQL
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD:?run scripts/local-env.sh to generate .env}
      # The one password every demo account signs in with. Generated into .env like the rest;
      # never a literal here, because this file is committed.
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:?run scripts/local-env.sh to generate .env}
      # No JwtOptions here on purpose: the migrator turns off EnableAuthentication, so it never
      # needs a signing key it could not use anyway.
    command: ["apply", "--seed", "--demo"]

  api:
    build:
      context: .
      dockerfile: src/Host/Dockerfile
      target: api
    image: boilerplate/api:local
    restart: unless-stopped
    depends_on:
      postgres:   { condition: service_healthy }
      valkey:     { condition: service_healthy }
      storage:    { condition: service_healthy }
      mailpit:    { condition: service_started }
      storage-init: { condition: service_completed_successfully }
      migrator:   { condition: service_completed_successfully }
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DatabaseOptions__Provider: POSTGRESQL
      DatabaseOptions__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-boilerplate};Username=${POSTGRES_USER:-boilerplate};Password=${POSTGRES_PASSWORD:?run scripts/local-env.sh to generate .env};Minimum Pool Size=5
      DatabaseOptions__MigrationsAssembly: Boilerplate.Migrations.PostgreSQL
      CachingOptions__Redis: valkey:6379
      CachingOptions__EnableSsl: "false"
      JwtOptions__SigningKey: ${JWT_SIGNING_KEY:?run scripts/local-env.sh to generate .env}
      #if (frontend)
      # Mailed links (password reset, email confirmation) go to a tenant's users, so the
      # origin the API writes into them defaults to the DASHBOARD's. MailLinkOrigin swaps in
      # the console's for the root tenant's own users (operators) — see ConsoleOriginUrl below.
      #else
      # No client ships with this product, so mailed links (password reset, email
      # confirmation) carry the API's own origin until you point this at the front end
      # you build. Unset, the API refuses to send those mails at all. There is no CORS
      # allow-list either: nothing browser-based calls this API yet.
      #endif
      OriginOptions__OriginUrl: ${APP_DASHBOARD_URL:-http://localhost:8081}
      #if (frontend)
      MailLinkOrigin__ConsoleOriginUrl: ${APP_CONSOLE_URL:-http://localhost:8082}
      CorsOptions__AllowedOrigins__0: ${APP_DASHBOARD_URL:-http://localhost:8081}
      CorsOptions__AllowedOrigins__1: ${APP_CONSOLE_URL:-http://localhost:8082}
      #endif
      AllowedHosts: ${ALLOWED_HOSTS:-localhost;127.0.0.1;api}
      # Nothing fronts the API here — it is published straight onto a host port — so forwarded
      # headers must not be honoured. appsettings.Production.json enables them for a Traefik
      # deployment and trusts nobody by default, which is a hard failure until a proxy is named.
      ProxyOptions__Enabled: "false"
      Storage__Provider: s3
      Storage__S3__ServiceUrl: http://storage:9000
      Storage__S3__PublicBaseUrl: http://localhost:${STORAGE_API_PORT:-9000}/${STORAGE_BUCKET:-boilerplate}
      Storage__S3__Region: us-east-1
      Storage__S3__Bucket: ${STORAGE_BUCKET:-boilerplate}
      Storage__S3__AccessKey: ${STORAGE_ACCESS_KEY:-boilerplate}
      Storage__S3__SecretKey: ${STORAGE_SECRET_KEY:?run scripts/local-env.sh to generate .env}
      Storage__S3__ForcePathStyle: "true"
      MailOptions__UseSendGrid: "false"
      MailOptions__From: no-reply@localhost
      MailOptions__DisplayName: Boilerplate
      MailOptions__Smtp__Host: mailpit
      MailOptions__Smtp__Port: "1025"
      # Mailpit speaks plain SMTP on the compose network and never advertises STARTTLS, which the
      # default (StartTls) requires. A real relay keeps the default.
      MailOptions__Smtp__SecureSocket: None
      # The literal OTEL_EXPORTER_OTLP_ENDPOINT name matters: AddHeroOpenTelemetry / AddHeroLogging
      # auto-detect that exact env var (the same convention Aspire uses to inject its own dashboard)
      # and export to it even though Exporter.Otlp.Enabled stays false in appsettings.Production.json —
      # no other wiring needed. Blank by default (nothing exported); point it at the otlp-receiver
      # service below, e.g. OTEL_EXPORTER_OTLP_ENDPOINT=http://otlp-receiver:18889 in .env.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${APP_API_PORT:-8080}:8080"
    # No container HEALTHCHECK: the runtime image is chiseled, so there is no
    # shell or curl to run one with. Probe from the host instead:
    #   curl -fsS http://localhost:8080/health/ready

  #if (frontend)
  # The two React clients (ADR-0008), each its own image served by nginx. Each proxies
  # /api and /health to the API on the compose network, so a browser only ever talks to
  # one origin — which is what lets the SameSite=Strict refresh cookie work without CORS
  # credentials. APP_API_URL is therefore an INTERNAL address, not a browser one;
  # `api` is in the API's AllowedHosts list because nginx forwards that Host.
  #
  # The dashboard: the app a tenant's own users sign in to.
  dashboard:
    build:
      context: clients/dashboard
    image: boilerplate/dashboard:local
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      APP_API_URL: http://api:8080
      # The browser fetches presigned URLs straight from the object store, so the client's
      # Content-Security-Policy has to name that origin.
      APP_STORAGE_URL: http://localhost:${STORAGE_API_PORT:-9000}
      APP_DEFAULT_TENANT: ${APP_DEFAULT_TENANT:-root}
    # 8080 in the container: the images run nginx as an unprivileged user, which
    # cannot bind a privileged port.
    ports:
      - "${APP_DASHBOARD_PORT:-8081}:8080"

  # The console: the operator tool. Same image shape, different app.
  console:
    build:
      context: clients/console
    image: boilerplate/console:local
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      APP_API_URL: http://api:8080
      APP_STORAGE_URL: http://localhost:${STORAGE_API_PORT:-9000}
      # Operators live in the root tenant; the console's sign-in form has no tenant field.
      APP_DEFAULT_TENANT: ${APP_DEFAULT_TENANT:-root}
      # Only so a tenant user who lands here can be pointed at the app that is theirs.
      APP_DASHBOARD_URL: ${APP_DASHBOARD_URL:-http://localhost:8081}
    ports:
      - "${APP_CONSOLE_PORT:-8082}:8080"
  #endif

volumes:
  pg_data:
  valkey_data:
  storage_data:
