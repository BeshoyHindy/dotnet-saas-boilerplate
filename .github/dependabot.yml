# Dependabot (issue #19).
#
# Tuned for Actions minutes, not for freshness. Four ecosystems, one grouped
# pull request each, once a month, at most two open at a time — a dependency
# update costs a full CI run, so the unit of work is "this month's updates",
# not "this package". `directories:` (plural) collapses every lockfile of an
# ecosystem into that single PR.
#
# Everything targets `develop`, not the default-in-name-only `main`: under
# gitflow (ADR-0007) `develop` integrates, and a PR against `main` would bypass
# every gate this repo runs.
#
# Security updates ignore all of this and open immediately, which is the point:
# they are the ones worth a run.
version: 2

updates:
  # ── .NET ────────────────────────────────────────────────────────────
  # Versions are centralized in src/Directory.Packages.props; Dependabot edits
  # that file directly.
  - package-ecosystem: nuget
    directory: '/'
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      nuget:
        patterns: ['*']

  # ── Node ────────────────────────────────────────────────────────────
  # Three independent lockfiles: pnpm at the root (the sandcastle orchestrator
  # only — the clients are deliberately not workspace packages) and one npm
  # lockfile per React client. One PR covers all three.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/clients/admin'
      - '/clients/dashboard'
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm:
        patterns: ['*']

  # ── GitHub Actions ──────────────────────────────────────────────────
  # The workflows pin major tags; this keeps those majors from going stale and
  # is the only automated way a deprecated runner image or action surfaces.
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      actions:
        patterns: ['*']

  # ── Container base images ───────────────────────────────────────────
  # The .NET hosts (src/Host/Dockerfile, both targets) and each client's nginx
  # image. A bump here runs the migrator smoke and nothing else — backend.yml's
  # `docker` path filter keeps the .NET suites out of it.
  - package-ecosystem: docker
    directories:
      - '/src/Host'
      - '/clients/admin'
      - '/clients/dashboard'
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker:
        patterns: ['*']
