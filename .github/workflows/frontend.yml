name: Frontend CI

# Frontend pipeline for the two React apps (clients/admin, clients/dashboard).
# Only does real work when clients/** changed; a backend-only PR still triggers
# the workflow but the heavy jobs skip and the always-running "Frontend CI" gate
# reports green so required status checks resolve. Playwright suites are
# route-mocked (no backend needed) — the configs boot a Vite dev server.
#
# Gitflow (ADR-0007): `develop` integrates, so the gates run on PRs into
# `develop`, `main` and the release/hotfix branches.
#
# Pull requests only. This workflow produces nothing but a verdict — the console
# image is published from backend.yml — so running it again on the push that
# merges the PR would re-prove the same commit at full price.

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Per app: a PR that only touches clients/dashboard must not rebuild and
      # re-e2e clients/admin.
      frontend: ${{ steps.filter.outputs.admin == 'true' || steps.filter.outputs.dashboard == 'true' }}
      apps: ${{ steps.apps.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'clients/admin/**'
              - '.github/workflows/frontend.yml'
            dashboard:
              - 'clients/dashboard/**'
              - '.github/workflows/frontend.yml'

      # The matrix is built from the filter, so an admin-only PR runs two jobs
      # instead of four. A change to this workflow touches both filters and so
      # lists both apps.
      - name: Build the app matrix
        id: apps
        env:
          ADMIN: ${{ steps.filter.outputs.admin }}
          DASHBOARD: ${{ steps.filter.outputs.dashboard }}
        run: |
          apps=()
          [ "$ADMIN" = true ] && apps+=('"admin"')
          [ "$DASHBOARD" = true ] && apps+=('"dashboard"')
          list="[$(IFS=,; echo "${apps[*]}")]"
          echo "Apps to build: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  lint-build:
    name: Lint & Build (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: clients/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` is `tsc -b && vite build` — this is the typecheck + bundle gate.
      - name: Build
        run: npm run build

  e2e:
    name: E2E (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: clients/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The Playwright config starts the Vite dev server itself and mocks all
      # API calls via page.route(), so no backend is required.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}
          path: clients/${{ matrix.app }}/playwright-report
          retention-days: 7

  # Single required status check — see backend.yml for the rationale.
  frontend-ci:
    name: Frontend CI
    needs: [changes, lint-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a required frontend job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required frontend job failed or was cancelled."
          exit 1
      - name: Success
        run: echo "Frontend CI passed."
