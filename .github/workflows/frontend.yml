name: Frontend CI

# Frontend pipeline for the console (clients/console). Only does real work when
# the console changed; a backend-only PR still triggers the workflow but the
# heavy jobs skip and the always-running "Frontend CI" gate reports green so
# required status checks resolve.
#
# Two suites, both backend-free: Vitest units next to the source, and a small
# Playwright smoke suite (sign-in, user CRUD, operator enters a tenant) whose
# config boots a Vite dev server and mocks every API call with page.route().
#
# The third gate is drift: `pnpm generate:api` must be a no-op against the
# checked-in contract (clients/openapi/v1.json). The backend half of that gate —
# re-exporting the document from the API — is the `openapi-drift` job in
# backend.yml; both call scripts/check-openapi-drift.sh (issue #15).
#
# Gitflow (ADR-0007): `develop` integrates, so the gates run on PRs into
# `develop`, `main` and the release/hotfix branches.
#
# Pull requests only. This workflow produces nothing but a verdict — the console
# image is published from backend.yml — so running it again on the push that
# merges the PR would re-prove the same commit at full price.

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists the PR's changed files

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            console:
              - 'clients/console/**'
              # The contract the client's types are generated from.
              - 'clients/openapi/**'
              - '.github/workflows/frontend.yml'

  console:
    name: Lint, build & test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/console
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corepack activates the pnpm version pinned in package.json#packageManager,
      # and must run before setup-node's pnpm cache resolution.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `build` is `tsc -b && vite build` — the typecheck + bundle gate.
      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # The frontend half of the OpenAPI drift gate (issue #15, ADR-0004):
      # regenerating the types from the checked-in document must change
      # nothing. Shared with the backend half in scripts/check-openapi-drift.sh
      # so the same check runs here and on a developer's machine.
      - name: API types match the contract
        working-directory: .
        run: bash scripts/check-openapi-drift.sh frontend

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: clients/console/playwright-report
          retention-days: 7

  # Single required status check — see backend.yml for the rationale.
  frontend-ci:
    name: Frontend CI
    needs: [changes, console]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a required frontend job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required frontend job failed or was cancelled."
          exit 1
      - name: Success
        run: echo "Frontend CI passed."
