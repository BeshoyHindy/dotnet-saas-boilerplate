name: Brand Gate

# ADR-0001: the upstream MIT copyright line in LICENSE is the only permitted
# upstream reference. This job runs on EVERY pull request (no path filters —
# a brand token can land in any file type). It does not run on the push that
# merges the PR: the gate already answered for that content, and nothing but a
# merge can change it.

on:
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  brand-gate:
    name: No upstream brand references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run brand gate
        run: bash scripts/brand-gate.sh
