name: Secret Scan

# The template must ship zero credential-shaped literals (.gitleaks.toml states
# the rule and its narrow allow-list). Like the brand gate this runs on EVERY
# pull request with no path filter — a secret can land in any file type.
#
# The upstream gitleaks *action* is licence-gated for organisations, so this job
# installs the (MIT) release binary itself and runs `gitleaks dir .`, exactly the
# command contributors run locally. No marketplace action, no licence key, and
# the version is one pinned line.
#
# Pull requests only: the push that merges a PR carries the same tree the gate
# just scanned.

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: No committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "$archive"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Fail on a truncated or swapped download rather than scanning with
          # whatever arrived.
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt gitleaks
          gitleaks version

      # `dir` scans the working tree (what the branch would ship), not history:
      # a secret that was committed and removed is a rotation job, not something
      # every future PR should fail on. --redact keeps findings out of the log.
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
