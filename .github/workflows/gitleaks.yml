name: Secret Scan

# The template must ship zero credential-shaped literals (.gitleaks.toml states
# the rule and its narrow allow-list). Like the brand gate this runs on EVERY
# pull request with no path filter — a secret can land in any file type.
#
# The upstream gitleaks *action* is licence-gated for organisations, so this job
# installs the (MIT) release binary itself and runs `gitleaks dir .`, exactly the
# command contributors run locally. No marketplace action, no licence key, and
# the version is one pinned line.
#
# Two scans: `dir` proves what the branch would ship; the commit-range scan over
# the PR's own commits catches a secret added in one commit and removed in a
# later one — `dir` would miss it, but it would still land in history on merge.
#
# Full history is not scanned here: an old, already-rotated leak is a rotation
# job, not something every PR should fail on. `.gitleaksignore` ignores the
# upstream-import commit's known non-secrets by fingerprint, so `gitleaks git .`
# stays clean for a local full-history audit.

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: No committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archive}" -o "$archive"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Fail on a truncated or swapped download rather than scanning with
          # whatever arrived.
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt gitleaks
          gitleaks version

      # `dir` scans the working tree: what the branch would ship. --redact keeps
      # findings out of the log.
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

      # The range scan: only the PR's own commits, not the whole repo history
      # (see the header comment). SHAs go through env: vars, never inlined into
      # the run script, per GitHub Actions injection hygiene.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"
