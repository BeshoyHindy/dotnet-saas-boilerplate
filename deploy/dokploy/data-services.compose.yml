# Dokploy stack 1 of 2 — the data plane (ADR-0005).
#
# PostgreSQL, Valkey and MinIO, plus the MinIO one-shots (volume owner, bucket
# creator, public-prefix grant). Kept in its own
# Dokploy Compose service so that redeploying the application (app.compose.yml)
# can never recreate, restart or wipe the database: the two stacks are separate
# docker compose projects with separate lifecycles and separate volumes.
#
# Because they are separate projects, service-name DNS does NOT cross between
# them. Every service therefore joins the shared external `dokploy-network`
# under an explicit `${STACK_NAME}-…` alias, and app.compose.yml dials those
# aliases. STACK_NAME is what keeps staging and production apart on one server.
#
# Nothing here publishes a host port. The only service the outside world may
# reach is MinIO, and it is reached through Traefik on STORAGE_DOMAIN.
#
# Deploy this stack FIRST and only again when a data-service version changes.
# See docs/deploy-dokploy.md.
#
# Every service below carries a memory limit and log rotation:
#   - Memory (`mem_limit`) is the one operator-tunable resource cap: an
#     `${..._MEM_LIMIT:-default}` so the 4 GB VPS the guide recommends gets
#     isolation between "one service misbehaves" and "the whole box goes down"
#     out of the box, but a bigger box can raise it without editing this file.
#     The defaults here sum to ~1.9 GB, leaving room for the app stack
#     (app.compose.yml) and Traefik/Dokploy's own processes on the same host.
#   - Logging (`logging: *default-logging`) rotates the default unbounded
#     `json-file` driver so container stdout cannot fill the disk that also
#     holds `pg_data` and `minio_data`. Fixed, not env-overridable — there is
#     no per-environment reason to want unbounded logs.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql and puts the
      # cluster in a major-version subdirectory under it; mounting .../data
      # instead is refused at startup.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      dokploy-network:
        aliases:
          - ${STACK_NAME}-postgres

  # ── Valkey (BSD-licensed Redis fork) ────────────────────────────────
  # No password: it is reachable only from inside dokploy-network, and a
  # credential here would be one more secret to rotate for no added boundary.
  # CachingOptions__Redis in app.compose.yml matches this (no auth, no TLS).
  valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    mem_limit: ${VALKEY_MEM_LIMIT:-256m}
    logging: *default-logging
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      dokploy-network:
        aliases:
          - ${STACK_NAME}-valkey

  # ── One-shot: hand the MinIO volume to the image's non-root user ────
  # The MinIO images this stack used to run (Docker Hub, then quay.io) ran as
  # root, so an existing minio_data is root-owned — and the Chainguard image
  # below runs as uid 65532, which dies on that volume with "Unable to write to
  # the backend". This chowns it in place before the server starts: every
  # uploaded object stays where it is and stays readable, and on a volume that
  # is already right it is a no-op, so it is safe on every redeploy. Do NOT
  # "fix" this by renaming the volume: that strands every upload in production.
  minio-volume-owner:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: "no"
    mem_limit: ${MINIO_ONESHOT_MEM_LIMIT:-64m}
    logging: *default-logging
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network

  # ── MinIO (S3-compatible object storage) ────────────────────────────
  # MinIO's own images are gone: Docker Hub stopped carrying them, then quay.io
  # withdrew anonymous pulls. Chainguard's free tier publishes only :latest, so
  # the image is pinned by digest — the data plane must come back byte-identical
  # after a host reboot. It ships `mc` and a shell too, so every MinIO one-shot
  # here uses the same pin.
  #
  # Routed through Traefik on STORAGE_DOMAIN because the API signs presigned
  # upload/download URLs against Storage__S3__ServiceUrl and hands them to the
  # browser — the signature covers the host, so the host the API signs with has
  # to be the host the browser resolves. app.compose.yml therefore points
  # ServiceUrl at https://${STORAGE_DOMAIN}, not at the internal alias.
  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    logging: *default-logging
    depends_on:
      minio-volume-owner:
        condition: service_completed_successfully
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Presigned URLs and redirects must carry the public host, not the
      # container's.
      MINIO_SERVER_URL: https://${STORAGE_DOMAIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    expose:
      - "9000"
    networks:
      dokploy-network:
        aliases:
          - ${STACK_NAME}-minio
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.${STACK_NAME}-storage-web.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME}-storage-web.entrypoints=web"
      - "traefik.http.routers.${STACK_NAME}-storage-web.middlewares=${STACK_NAME}-storage-https"
      - "traefik.http.routers.${STACK_NAME}-storage-web.service=${STACK_NAME}-storage"
      - "traefik.http.routers.${STACK_NAME}-storage.rule=Host(`${STORAGE_DOMAIN}`)"
      - "traefik.http.routers.${STACK_NAME}-storage.entrypoints=websecure"
      - "traefik.http.routers.${STACK_NAME}-storage.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${STACK_NAME}-storage.service=${STACK_NAME}-storage"
      # One redirect middleware per service, never a shared name: Traefik reports
      # a middleware defined by two different containers as a configuration error.
      - "traefik.http.middlewares.${STACK_NAME}-storage-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${STACK_NAME}-storage-https.redirectscheme.permanent=true"
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.server.port=9000"
      # S3 signatures cover the Host header, so Traefik must forward the one the
      # client signed. (It is Traefik's default; stated so a future edit has to
      # delete it on purpose.)
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.passhostheader=true"
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.healthcheck.path=/minio/health/live"
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.healthcheck.timeout=5s"
      - "traefik.http.services.${STACK_NAME}-storage.loadbalancer.healthcheck.hostname=${STORAGE_DOMAIN}"

  # ── One-shot: create the buckets the Files module and the backup ────
  # service write to. The application never auto-creates the Files bucket, so
  # without this the first upload fails with NoSuchBucket; the backup bucket
  # is created here too so postgres-backup-upload never races bucket creation.
  # `mb` accepts multiple targets and is idempotent (--ignore-existing), so
  # both are safe on every redeploy.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: "no"
    mem_limit: ${MINIO_ONESHOT_MEM_LIMIT:-64m}
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${STORAGE_BUCKET}", "local/${BACKUP_BUCKET}"]
    networks:
      - dokploy-network

  # ── One-shot: open anonymous reads on the `uploads/` prefix ONLY ────
  # Avatars and tenant branding go through IStorageService.UploadAsync, which
  # returns BuildPublicUrl(key) — an unsigned URL under `uploads/` that the
  # browser fetches straight from MinIO in an <img src>. MinIO buckets are
  # private by default, so without this grant every avatar and logo 403s.
  #
  # The prefix is deliberately `uploads/` and NOT the bucket. Files-module
  # objects live under `tenants/…` where public and private files share one key
  # space and visibility is a database column (FileAsset.Visibility), so opening
  # that prefix would make ChangeFileVisibility meaningless: a file flipped back
  # to Private would stay fetchable at its known URL forever. Widening this to
  # `local/${STORAGE_BUCKET}` is a data leak, not a convenience — the contract
  # test asserts the prefix for that reason.
  #
  # Within `uploads/` the objects are themselves tenant-prefixed —
  # `uploads/tenants/{tenantId}/…`, composed by the Storage block (ADR-0002,
  # issue #78). That is a property of the keys, not of this grant: it stays at
  # the `uploads/` top level so one one-shot covers every tenant, including the
  # ones provisioned after the stack was deployed. Narrowing it to a single
  # tenant would 403 every other tenant's branding.
  #
  # A separate one-shot rather than `mb && anonymous set` in one: the image does
  # ship a shell, but `entrypoint: ["mc"]` keeps both steps shell-free, so a
  # future image without one cannot break them and there is no quoting to get
  # wrong. Both are idempotent.
  minio-public-prefix:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: "no"
    mem_limit: ${MINIO_ONESHOT_MEM_LIMIT:-64m}
    logging: *default-logging
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["mc"]
    command: ["anonymous", "set", "download", "local/${STORAGE_BUCKET}/uploads"]
    networks:
      - dokploy-network

  # ── Postgres backup: pg_dump on a schedule, kept for N days ──────────
  # D1 (deploy-operability research): pg_data was a plain named volume with no
  # snapshot, replication or export step, so a host disk failure, `docker
  # volume rm`, or a destructive migration had no recovery path but "there is
  # no backup". This runs pg_dump on a cron schedule into its own volume, and
  # postgres-backup-upload (below) mirrors that volume to the object store.
  #
  # Image is the SAME postgres:18-alpine as the `postgres` service, pinned by
  # tag AND digest (the ticket's requirement, and the only way to guarantee
  # pg_dump's major version never drifts ahead of or behind the server it
  # dumps — pg_dump refuses a server whose major version is newer than its
  # own). The one commonly used third-party "pg_dump + S3 upload" image
  # (eeshugerman/postgres-backup-s3) ships only a `:16` tag — its pg_dump
  # would refuse this stack's PostgreSQL 18 server outright — which is why
  # this is a pair of services instead of one: this one only ever needs to
  # speak the same protocol version as `postgres`, and mirroring to the
  # object store is a separate concern the image already used for MinIO
  # (below) already knows how to do.
  #
  # BACKUP_SCHEDULE is a standard 5-field cron expression (default: daily at
  # 03:00). BACKUP_KEEP_DAYS bounds the volume itself — a dump older than this
  # is deleted locally, and postgres-backup-upload's `--remove` mirror follows
  # that deletion to the bucket, so retention only has to be declared once.
  postgres-backup:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    mem_limit: ${POSTGRES_BACKUP_MEM_LIMIT:-256m}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - pg_backups:/backups
    # entrypoint/command below is compose-interpolated like the rest of this
    # file (docker compose substitutes a variable reference anywhere in the
    # YAML, this string included), so every dollar sign meant for the
    # CONTAINER's shell at runtime — not for compose's own .env substitution —
    # is doubled to survive as a literal dollar sign, and written without
    # curly braces so it can never be mistaken for a brace-delimited
    # reference compose is actually substituting elsewhere in this file. Only
    # BACKUP_SCHEDULE below is a deliberate compose-time substitution
    # (matches the `environment:` block above).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cat > /usr/local/bin/run-backup.sh <<'SCRIPT'
        #!/bin/sh
        set -eu
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        out=/backups/$$POSTGRES_DB-$$ts.dump
        pg_dump -Fc -h "$$PGHOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f "$$out"
        find /backups -name '*.dump' -mtime "+$$BACKUP_KEEP_DAYS" -delete
        SCRIPT
        chmod +x /usr/local/bin/run-backup.sh
        echo "${BACKUP_SCHEDULE} /usr/local/bin/run-backup.sh >>/proc/1/fd/1 2>&1" > /etc/crontabs/root
        exec crond -f -d 8
    networks:
      - dokploy-network

  # ── Postgres backup: mirror the dump volume to the object store ─────
  # `mc mirror --watch` keeps watching /backups for the life of the container,
  # so a dump written by postgres-backup's cron job is uploaded within
  # seconds rather than on some second schedule of its own; `--remove`
  # mirrors postgres-backup's own retention deletes to the bucket, so
  # BACKUP_KEEP_DAYS is the only retention knob. Same pinned Chainguard image
  # as `minio` and the other one-shots above — MinIO's own client images are
  # gone from both Docker Hub and quay.io (see the `minio` service comment),
  # so this is the only maintained, pinnable `mc` available to this stack.
  postgres-backup-upload:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    restart: unless-stopped
    mem_limit: ${POSTGRES_BACKUP_UPLOAD_MEM_LIMIT:-64m}
    logging: *default-logging
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    volumes:
      - pg_backups:/backups:ro
    entrypoint: ["mc"]
    command: ["mirror", "--watch", "--remove", "/backups", "local/${BACKUP_BUCKET}"]
    networks:
      - dokploy-network

volumes:
  pg_data:
  pg_backups:
  valkey_data:
  minio_data:

networks:
  # Created by the Dokploy installer; every stack on the server shares it and
  # Traefik watches it. Declared external so a redeploy never recreates it.
  dokploy-network:
    external: true
