# Secret scanning configuration.
#
#   gitleaks dir .            # working tree, uses this file automatically
#   gitleaks detect --no-git  # same, for older invocations
#
# The template must ship zero credential-shaped literals: every secret comes from user-secrets,
# environment variables or Aspire parameters. The allow-list below is deliberately narrow — each
# entry names one non-secret that the generic rules cannot tell apart from a real one.

title = "Boilerplate secret scan"

[extend]
useDefault = true

[allowlist]
description = "Build output and documented non-secrets"
# Match the regexes below against the whole line, so an entry can name the context around a value.
regexTarget = "line"

paths = [
  # Build output is a copy of tracked files; scanning it double-reports and, when stale, reports
  # secrets that no longer exist in the source.
  '''(^|/)bin/''',
  '''(^|/)obj/''',
  '''(^|/)node_modules/''',
  # Local runtime state, gitignored like bin/obj: audit dead-letter dumps contain hashes of real
  # request data from a dev run, and are never committed.
  '''(^|/)audit-dlq/''',
  # The .env that scripts/local-env.sh generates for docker-compose. It holds real (if disposable)
  # local secrets by design and is gitignored — flagging it would make the gate fail on every
  # machine that has ever run the local stack. .env.example, which is committed, is still scanned.
  '''^\.env$''',
]

regexes = [
  # The jwt.io sample token (subject "1234567890", signed with the public key "your-256-bit-secret").
  # It is a shape fixture for RefreshTokenCommandValidator, not a credential.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\..*''',
  # "S3-compatible" in prose trips the generic-api-key entropy rule.
  '''S3-compatible''',
  # A container image digest pinned as a C# constant (…Digest = "<64 hex>"): a public content hash,
  # not a credential, but its entropy trips generic-api-key.
  '''Digest\s*=\s*"[0-9a-f]{64}"''',
]
